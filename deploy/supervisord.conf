[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisor/supervisord.pid
loglevel=info

; ── 1. Orchestrator — FastAPI / uvicorn ──────────────────────────────────────
; Cloud Run routes external HTTPS traffic to port 8080.
; workers=2 is safe for 2 vCPUs; Cloud Run concurrency handles the rest.
[program:orchestrator]
command=uvicorn agents.orchestrator.agent:app --host 0.0.0.0 --port 8080 --workers 2 --log-level info --no-access-log
directory=/app
user=sihalink
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
environment=PYTHONUNBUFFERED="1",PORT="8080"

; ── 2. Notify Agent — Node.js / grammY / Fastify ─────────────────────────────
; Telegram bot long-polling + inbound HTTP from the Orchestrator on :3001.
; Internal only — not reachable from outside the container.
[program:notify-agent]
command=node agents/notify/dist/bot.js
directory=/app
user=sihalink
autostart=true
autorestart=true
startretries=5
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
environment=NOTIFY_PORT="3001",NODE_ENV="production"

[unix_http_server]
file=/var/run/supervisor/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
