# =============================================================================
# SihaLink — Cloud Run Service definition (v2 API)
#
# Deploy with:
#   gcloud run services replace deploy/service.yaml --region us-central1
#
# Or use the gcloud CLI deploy command in deploy/deploy.sh
# =============================================================================
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sihalink-orchestrator
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        # Keep 1 warm instance — CHVs are in the field, cold starts are unacceptable
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        # gen2 execution environment: faster startup, full Linux kernel
        run.googleapis.com/execution-environment: gen2
        # CPU always allocated so SSE keepalive tasks don't stall between requests
        run.googleapis.com/cpu-throttling: "false"
    spec:
      serviceAccountName: sihalink-orchestrator@kephothoagenticai.iam.gserviceaccount.com
      containerConcurrency: 80
      # 3600s = 1 hour — required for long-lived SSE /swarm/stream connections
      timeoutSeconds: 3600
      containers:
        - image: gcr.io/kephothoagenticai/sihalink-orchestrator:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            # ── Non-sensitive config ─────────────────────────────────────────
            - name: ENVIRONMENT
              value: production
            - name: PORT
              value: "8080"
            - name: NOTIFY_AGENT_URL
              value: http://localhost:3001
            - name: GOOGLE_CLOUD_PROJECT
              value: kephothoagenticai
            - name: GOOGLE_CLOUD_LOCATION
              value: us-central1
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "TRUE"
            - name: DYNATRACE_ENV_ID
              value: xjn51780
            # ── Secrets (pulled from Secret Manager at deploy time) ──────────
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: GEMINI_API_KEY
                  key: latest
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_MAPS_API_KEY
                  key: latest
            - name: MONGODB_ATLAS_URI
              valueFrom:
                secretKeyRef:
                  name: MONGODB_ATLAS_URI
                  key: latest
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: TELEGRAM_BOT_TOKEN
                  key: latest
            - name: FACILITY_TELEGRAM_ID
              valueFrom:
                secretKeyRef:
                  name: FACILITY_TELEGRAM_ID
                  key: latest
            - name: VOYAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: VOYAGE_API_KEY
                  key: latest
            - name: DYNATRACE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: DYNATRACE_API_TOKEN
                  key: latest
          # ── Startup probe: wait until FastAPI lifespan completes ──────────
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12 # 60s total startup window
          # ── Liveness probe: restart if health endpoint stops responding ────
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
  traffic:
    - percent: 100
      latestRevision: true
