<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>SihaLink — Kenya National Disease Surveillance</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Roboto (Material 3 typeface) -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- Material Symbols Outlined — variable-font icon set -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    rel="stylesheet">

  <!--
    ═══════════════════════════════════════════════════════════════════════
    Dynatrace Real User Monitoring (RUM) — configure when ready
    ═══════════════════════════════════════════════════════════════════════
    To enable:
      1. In Dynatrace: Digital Experience → Web Applications → + New application
      2. Copy the JS snippet URL from the setup page
      3. Uncomment the <script> tag below and replace the src with your URL
         Example: https://js-cdn.dynatrace.com/jstag/17a3456abc/1234567890_complete.js
    ═══════════════════════════════════════════════════════════════════════
  -->

  <!-- dtrum stub — always defined so Angular ErrorHandler never throws -->
  <script>
    window.dtrum = window.dtrum || {
      reportError: function (e) { },
      enterAction: function (n) { return 0; },
      leaveAction: function (id) { },
      sendSessionProperties: function (p) { },
      addActionProperties: function (p) { },
      setPage: function (p) { },
      identifyUser: function (u) { },
    };
  </script>

  <!-- Dynatrace RUM loader — uncomment and set src when tenant URL is available
  <script type="text/javascript" src="https://js-cdn.dynatrace.com/jstag/YOUR_TENANT_PATH_complete.js"
    crossorigin="anonymous"
    onerror="console.info('[Dynatrace] RUM script unavailable')">
  </script>
  -->
</head>

<body class="mat-app-background">
  <app-root>
    <style>
      .siha-splash {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background: radial-gradient(circle at center, #0F172A 0%, #020617 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: 'Roboto', sans-serif;
      }
      .siha-splash-logo {
        width: 280px;
        max-width: 80vw;
        animation: splash-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        filter: drop-shadow(0 0 20px rgba(0, 229, 204, 0.2));
      }
      .siha-loader-wrapper {
        margin-top: 50px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .siha-loader {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(0, 229, 204, 0.15);
        border-radius: 50%;
        border-top-color: #00E5CC;
        animation: splash-spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .siha-splash-text {
        margin-top: 24px;
        color: #94A3B8;
        font-size: 13px;
        letter-spacing: 3px;
        font-weight: 500;
        text-transform: uppercase;
        animation: splash-fade 1.5s ease-in-out infinite alternate;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.97); opacity: 0.85; }
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes splash-fade {
        from { opacity: 0.4; }
        to { opacity: 1; }
      }
    </style>
    <div class="siha-splash">
      <img src="logo.svg" alt="SihaLink" class="siha-splash-logo" />
      <div class="siha-loader-wrapper">
        <div class="siha-loader"></div>
        <div class="siha-splash-text">Initializing Swarm</div>
      </div>
    </div>
  </app-root>
</body>

</html>
