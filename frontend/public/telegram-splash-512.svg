<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for Premium Feel -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <!-- Health/Teal Gradient for Logo -->
    <linearGradient id="healthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5CC" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    
    <!-- Subtle Glow for the Node Lines -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Outer Hexagon Base (Swarm/Node concept) scaled for 512x512 -->
  <g transform="translate(156, 100) scale(2)">
    <path d="M 50,20 L 80,35 L 80,75 L 50,90 L 20,75 L 20,35 Z" fill="none" stroke="url(#healthGrad)" stroke-width="4" filter="url(#glow)"/>
    
    <!-- Medical Cross / Link inside -->
    <path d="M 50,40 L 50,70 M 35,55 L 65,55" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Connection Dots -->
    <circle cx="50" cy="20" r="4" fill="#00E5CC" />
    <circle cx="80" cy="75" r="4" fill="#3B82F6" />
    <circle cx="20" cy="75" r="4" fill="#00E5CC" />
  </g>

  <!-- Typography underneath the icon -->
  <text x="256" y="380" font-family="'Inter', 'Roboto', sans-serif" font-weight="700" font-size="64" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">
    Siha<tspan fill="#00E5CC">Link</tspan>
  </text>
  
  <text x="256" y="420" font-family="'Inter', 'Roboto', sans-serif" font-weight="300" font-size="18" fill="#94A3B8" text-anchor="middle" letter-spacing="6">
    DISEASE SURVEILLANCE SWARM
  </text>
</svg>
