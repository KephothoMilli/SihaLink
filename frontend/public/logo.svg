<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="healthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5CC" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagon Base (Swarm/Node concept) -->
  <path d="M 50,20 L 80,35 L 80,75 L 50,90 L 20,75 L 20,35 Z" fill="none" stroke="url(#healthGrad)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Medical Cross / Link inside -->
  <path d="M 50,40 L 50,70 M 35,55 L 65,55" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Connection Dots -->
  <circle cx="50" cy="20" r="4" fill="#00E5CC" />
  <circle cx="80" cy="75" r="4" fill="#3B82F6" />
  <circle cx="20" cy="75" r="4" fill="#00E5CC" />

  <!-- Text -->
  <text x="110" y="70" font-family="'Inter', 'Roboto', sans-serif" font-weight="700" font-size="48" fill="#FFFFFF" letter-spacing="-1">
    Siha<tspan fill="#00E5CC">Link</tspan>
  </text>
  <text x="114" y="90" font-family="'Inter', 'Roboto', sans-serif" font-weight="300" font-size="12" fill="#94A3B8" letter-spacing="4">
    DISEASE SURVEILLANCE SWARM
  </text>
</svg>
