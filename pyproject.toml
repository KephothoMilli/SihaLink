[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sihalink"
version = "2.0.0"
description = "SihaLink — Multi-agent disease surveillance for Kenya"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*"]
